[workspace]
members = [
    "crates/egressd-core",
    "crates/egressd-orchestrator",
    "crates/egressd-api",
    "crates/egressd-forward",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Devstroop <hi@devstroop.com>"]
license = "MIT"
repository = "https://github.com/devstroop/egressd"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
bollard = "0.18"
reqwest = { version = "0.12", features = ["json", "socks"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
